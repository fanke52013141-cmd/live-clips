# Alembic config for studio migrations (ASCII-only: Alembic reads ini with
# the system locale encoding, which is GBK on this Windows host).
[alembic]
script_location = studio/migrations
# sqlalchemy.url is injected by the caller (tests/CLI) or STUDIO_DATABASE_URL env.
sqlalchemy.url = sqlite:///./.data-dev/studio.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s